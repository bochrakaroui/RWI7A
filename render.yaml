services:
  - type: web
    name: perfume-recommendation-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      python -m unittest discover -s backend/tests -v &&
      python backend/evaluate_recommendations.py --rebuild --top-n 1
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: perfume-recommendation-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: perfume-recommendation-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: perfume-recommendation-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
